    <!-- Attributes -->
    <!-- Opens a new black context for the URL specified -->
    <a href="https://www.google.com" target="_blank">Google</a><br />
    <a href="https://www.linkedin.com/in/saghedev" target="_blank">Linked handle</a><br />
    <!-- Opens the URL in the particular tab or context of browser you are. -->
    <a href="https://www.google.com" target="_self">Google</a><br />
    <!-- Opens the URL in the parent of the current tab or context of browser -->
    <a href="https://www.google.com" target="_parent">Google</a><br />
    <!-- Opens the URL in the top of the current tab or context of browser -->
    <a href="https://www.google.com" target="_top">Google</a><br />

    <!-- Image tag -->
    <!-- 
        src - source of the image
        alt - alternative text for the image
        width - width of the image
