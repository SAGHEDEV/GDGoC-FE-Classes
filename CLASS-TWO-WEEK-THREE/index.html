<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css">
    <title>HTML Proper Structure</title>
</head>

<body>
    <!-- We would be looking at the right way to structure HTML page -  making use of w3schools website as a reference -->
    <header class="main-header">
        <div class="main-header-left-panel">
            <a href="/" aria-label="Home" title="Home" class="logo">
                <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a0/W3Schools_logo.svg/1280px-W3Schools_logo.svg.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=thumbnail"
                    alt="W3schools log" width="200" height="200">
            </a>
            <nav aria-label="Main Navigation" title="Main Navigation" class="main-navigation">
                <a href="#" aria-label="Tutorials" title="Tutorials" class="main-navigation-item">Tutorials</a>
                <a href="#" aria-label="References" title="References" class="main-navigation-item">References</a>
                <a href="#" aria-label="Exercises and quizzes" title="Exercises and quizzes"
                    class="main-navigation-item">Exercises</a>
                <a href="#" aria-label="Certificates" title="Certificates" class="main-navigation-item">Certificates</a>
            </nav>
            <div class="main-navigation-search">
                <input type="text" placeholder="Search..." name="search" class="main-navigation-item" />
                <button class="main-navigation-button"><i class="fi fi-rr-search"></i></button>
            </div>
            <span class="see-more-icon">
                <i class="fi fi-rr-menu-burger" title="See More"></i>
            </span>
        </div>
        <div class="main-header-right-panel">
            <button class="navigation-button link-button">Spaces.</button>
            <button class="navigation-button link-button">Upgrade</button>
            <button class="navigation-button link-button">App</button>
            <button class="navigation-button">Paid Courses</button>
            <button class="navigation-button">Sign in</button>
        </div>
    </header>
<div>
    When you want to create an element: you make use of &lt;&gt;
</div>

</body>

</html>
